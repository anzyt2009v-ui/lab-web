<html lang="uk">
<head>
    <meta charset="UTF-8">

</head>
<body>

    <ul class="menu">
        <li><a href="index.html">Головна</a></li>

        <li><a href="table.html">Таблиця</a></li>
    </ul>
    <hr>

    <div class="main" style="width:auto">
        <h1>Динамічна таблиця</h1>

        <button id="refresh">Оновити</button>
        <button id="sortName">Сортувати за іменем</button>
        <button id="sortAff">Сортувати за фракцією</button>

        <table>
            <thead>
                <tr><th>Імʼя</th><th>Фракція</th></tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>

    <script>
        var data = [];

        // малюємо таблицю з масиву data
        function show() {
            $('#rows').empty();
            $.each(data, function (i, p) {
                $('#rows').append('<tr><td>' + p.name + '</td><td>' + p.affiliation + '</td></tr>');
            });
        }

        // завантажуємо дані з сервера
        function load() {
           $.getJSON('data.json?' + Date.now(), function (result) {
                data = result;
                show();
            });
        }

        $('#refresh').click(load);

        $('#sortName').click(function () {
            data.sort(function (a, b) { return a.name.localeCompare(b.name); });
            show();
        });

        $('#sortAff').click(function () {
            data.sort(function (a, b) { return a.affiliation.localeCompare(b.affiliation); });
            show();
        });

        load();   // завантажити дані при відкритті сторінки
    </script>
</body>
</html>
