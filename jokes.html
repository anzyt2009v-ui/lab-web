    <div class="main" style="width:auto">
        <h1>Випадковий жарт</h1>
        <p id="joke">Натисни кнопку</p>
        <button onclick="loadJoke()">Показати жарт</button>
    </div>

    <script>
        function loadJoke() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'jokes.txt');
            xhr.onload = function () {
                var jokes = xhr.responseText.split('\n');
                var i = Math.floor(Math.random() * jokes.length);
                document.getElementById('joke').innerText = jokes[i];
            };
            xhr.send();
        }
    </script>
